<!doctype html><html><head><meta charset="utf-8"><title>Hedgerow preview</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2b2418;display:flex;gap:12px;padding:12px}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="map"></canvas>
<script src="js/data.js"></script><script src="js/sim.js"></script><script src="js/draw.js"></script>
<script>
const st = Sim.newGame(4);
Draw.init(document.getElementById('map'));
Draw.resize(1200, 960);
setTimeout(() => Draw.render(st, { showAll: true, selected: Sim.unitById(st, 'A'), spots: [{ x: 1, y: 2, kind: 'move' }, { x: 0, y: 1, kind: 'move' }] }), 300);
</script></body></html>
