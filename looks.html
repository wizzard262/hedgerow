<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hedgerow: look options</title>
<style>
  body { margin: 0; background: #2f2a22; color: #efe6cf; font: 15px Georgia, serif; padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  figure { margin: 0; background: #3a342a; border-radius: 8px; padding: 8px; }
  figcaption { margin: 4px 2px 6px; font-weight: 600; }
  canvas { width: 100%; border-radius: 4px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<canvas id="work" style="display:none"></canvas>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/draw.js"></script>
<script>
  // Four looks side by side, on the same corner of the same board
  const OPTIONS = [
    ['A · Muted, life-size pieces (now)', { size: 1, base: 'none', palette: 'muted' }],
    ['B · Muted, bigger pieces on soft discs', { size: 1.5, base: 'disc', palette: 'muted' }],
    ['C · Muted map, pieces on counters', { size: 1.35, base: 'token', palette: 'muted' }],
    ['D · Inked staff map, bigger pieces', { size: 1.5, base: 'disc', palette: 'ink' }],
  ];
  const st = Sim.newGame(4);
  // Bring a German company and a Panther platoon into view beside the Americans for the comparison
  for (const id of ['d1', 'dmg1']) Object.assign(Sim.unitById(st, id), { x: 2, y: 2 });
  st.units.push(Object.assign({}, Sim.unitById(st, 'T1'), { id: 'pan', kind: 'panther', side: 'de', name: 'Panther', x: 2, y: 4, platoons: 2 }));
  const work = document.getElementById('work');
  Draw.init(work);
  Draw.resize(3000, 2400);
  for (const [name, style] of OPTIONS) {
    Draw.setStyle(style);
    Draw.render(st, { showAll: true });
    const f = document.createElement('figure'), cap = document.createElement('figcaption'), c = document.createElement('canvas');
    cap.textContent = name;
    // Three fields across and three and a half down, from the west edge
    const S = work.width / COLS, cx = 0, cy = 1.6, cw = 3, ch = 3.4;
    c.width = cw * S; c.height = ch * S;
    c.getContext('2d').drawImage(work, cx * S, cy * S, cw * S, ch * S, 0, 0, cw * S, ch * S);
    f.append(cap, c);
    document.getElementById('grid').append(f);
  }
</script>
</body>
</html>
