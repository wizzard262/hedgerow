<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parachute variations</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1a17; color: #eee; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .tag { position: absolute; transform: translate(-50%, 0); text-align: center; width: 180px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  .tag b { display: block; font-size: 22px; color: #ffd36b; }
  #bar { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; }
  #bar button { font: inherit; padding: 6px 14px; margin: 0 4px; border-radius: 6px; border: 1px solid #777; background: #2d2b27; color: #eee; cursor: pointer; }
  #bar button.on { background: #ffd36b; color: #222; }
</style>
</head>
<body>
<div id="bar">
  <button data-what="paras" class="on">Paratroopers</button>
  <button data-what="crate">Supply crate</button>
  <button id="slow">Slow motion</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/models.js"></script>
<script>
// Parachute variations for Steve to pick from: the one in the game now, then four bigger, less even ones that swing
// on the way down. Each column is one field of the table, with the men at the game's own size (MEN in board3d.js)
const T = THREE;
const MEN = 2.45;          // the men's scale on the table (board3d.js)
const FALL = 4.2;          // seconds from the top to the ground
const SETTLE = 1.6;        // seconds for the canopy to fall over and go
const REST = 0.7;          // seconds before it starts again
const START = 1.5;         // how high above the table it starts

// The five to compare. R: canopy radius, gores: panels, flat: dome height to radius, bulge: how far each panel puffs
// out between its lines, scallop: how far the hem rises between lines, lumpy: fixed unevenness, breathe: the canopy
// puffing in and out, ripple: a wave running round the hem, dent: one side pushed in by the air, swing: degrees
// either way, period: seconds a swing, spin: turning slowly, drift: sideways wind over the fall
const VARIANTS = [
  { key: 'Now', name: 'Now', note: 'in the game today', now: true },
  { key: 'A', name: 'Silk panels', note: 'bigger, 24 panels, scalloped hem, gentle swing',
    R: 0.27, gores: 24, flat: 0.62, bulge: 0.05, scallop: 0.04, lumpy: 0.05, breathe: 0, ripple: 0, dent: 0,
    swing: 10, period: 1.9, spin: 0, drift: 0.05, colour: '#d9d1b8', panels: 0.06 },
  { key: 'B', name: 'Breathing', note: 'puffs in and out, uneven, wider swing',
    R: 0.29, gores: 28, flat: 0.58, bulge: 0.06, scallop: 0.05, lumpy: 0.09, breathe: 0.07, ripple: 0, dent: 0,
    swing: 16, period: 2.1, spin: 0, drift: 0.1, colour: '#d0c7a8', panels: 0.05 },
  { key: 'C', name: 'Olive drab', note: 'army green panels, vent hole, slow turn',
    R: 0.28, gores: 24, flat: 0.6, bulge: 0.05, scallop: 0.04, lumpy: 0.08, breathe: 0.03, ripple: 0, dent: 0,
    swing: 12, period: 2.0, spin: 0.35, drift: 0.06, colour: '#77764a', panels: 0.18, vent: 0.16 },
  { key: 'D', name: 'Big and wild', note: 'biggest, lopsided, flapping hem, big swing',
    R: 0.35, gores: 28, flat: 0.55, bulge: 0.06, scallop: 0.05, lumpy: 0.13, breathe: 0.05, ripple: 0.035, dent: 0.14,
    swing: 22, period: 2.4, spin: 0, drift: 0.16, colour: '#c9bf9d', panels: 0.07 }
];

// ---------- The scene: a strip of fields, lit like the game's table ----------
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.outputEncoding = T.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color('#1b1a17');
scene.add(new T.HemisphereLight(0xdfe8ff, 0x3a3020, 0.55));
const lamp = new T.DirectionalLight(0xffe8c8, 1.5);
lamp.position.set(-3, 9, -4);
lamp.target.position.set(3, 0, 0.5);
lamp.castShadow = true;
lamp.shadow.mapSize.set(2048, 2048);
Object.assign(lamp.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
scene.add(lamp, lamp.target);
const camera = new T.PerspectiveCamera(34, 1, 0.1, 80);
Models.materials();

// One field a variation, side by side
const GAP = 1.15;
const columnX = k => 0.5 + k * GAP;
VARIANTS.forEach((v, k) => {
  const ground = Models.field('grass', false, k);
  ground.position.set(columnX(k), 0, 0.5);
  scene.add(ground);
});

// ---------- A canopy: a grid of points worked out again every frame ----------
const RINGS = 12;
function makeCanopy(v) {
  const segs = v.gores * 4;
  const count = (RINGS + 1) * (segs + 1);
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(new Float32Array(count * 3), 3));
  // Each panel a shade lighter or darker than the next, as silk catches the light
  const colours = new Float32Array(count * 3);
  const base = new T.Color(v.colour);
  for (let i = 0; i <= RINGS; i++) {
    for (let j = 0; j <= segs; j++) {
      const panel = Math.floor((j + 0.5) / 4) % 2;
      const shade = panel ? 1 - v.panels : 1;
      const n = (i * (segs + 1) + j) * 3;
      colours[n] = base.r * shade; colours[n + 1] = base.g * shade; colours[n + 2] = base.b * shade;
    }
  }
  geo.setAttribute('color', new T.BufferAttribute(colours, 3));
  // Two triangles for every little square of the grid
  const index = [];
  for (let i = 0; i < RINGS; i++) {
    for (let j = 0; j < segs; j++) {
      const a = i * (segs + 1) + j, b = a + segs + 1;
      index.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  geo.setIndex(index);
  const material = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: T.DoubleSide, transparent: true });
  const mesh = new T.Mesh(geo, material);
  mesh.castShadow = true;
  // The fixed unevenness: a random push for every panel, smoothed round the canopy
  const lumps = [];
  for (let g = 0; g < v.gores; g++) lumps.push(Math.random() * 2 - 1);
  // And a shape of its own, so no two are alike: a little oval, two and three big bulges round it, the hem lower on
  // one side
  const shape = {
    sx: 0.9 + Math.random() * 0.2, sz: 0.9 + Math.random() * 0.2,
    a2: 0.5 + Math.random(), p2: Math.random() * 6.3, a3: 0.5 + Math.random(), p3: Math.random() * 6.3,
    tiltDir: Math.random() * 6.3
  };
  mesh.userData = { segs, lumps, shape };
  return mesh;
}

// Where a point of the canopy sits: ring i (0 at the top, RINGS at the hem), point j round it, at time t
function canopyPoint(v, mesh, i, j, t, out) {
  const { segs, lumps, shape } = mesh.userData;
  const down = i / RINGS;
  const theta = (v.vent || 0) + down * (1.25 - (v.vent || 0));
  const phi = (j / segs) * Math.PI * 2;
  // How far across its panel the point is: 0 on a line, 1 in the middle
  const across = Math.sin(Math.PI * ((phi * v.gores / (Math.PI * 2)) % 1));
  // The smooth unevenness between one panel and the next
  const at = phi * v.gores / (Math.PI * 2);
  const g0 = Math.floor(at) % v.gores, g1 = (g0 + 1) % v.gores, f = at - Math.floor(at);
  const blend = (1 - Math.cos(f * Math.PI)) / 2;
  const lump = lumps[g0] * (1 - blend) + lumps[g1] * blend;
  // The plain dome, each panel puffed out between its lines
  let r = v.R * Math.sin(theta) * (1 + v.bulge * across * down);
  let y = v.R * v.flat * Math.cos(theta);
  // Uneven, breathing, pushed in on one side, a wave round the hem
  r *= 1 + v.lumpy * lump * Math.sin(theta);
  r *= 1 + v.lumpy * 0.8 * (shape.a2 * Math.cos(2 * phi + shape.p2) + shape.a3 * Math.cos(3 * phi + shape.p3)) * Math.sin(theta);
  y += v.lumpy * v.R * 0.9 * Math.cos(phi - shape.tiltDir) * down;
  const breath = Math.sin(t * 3.1);
  r *= 1 + v.breathe * breath * down;
  y *= 1 - v.breathe * 0.6 * breath;
  r *= 1 - v.dent * Math.pow(Math.max(0, Math.cos(phi - 0.8)), 3) * Math.sin(theta);
  r += v.ripple * v.R * Math.sin(phi * 3 - t * 5.5) * Math.pow(down, 3);
  // The hem rises between the lines: scallops
  y += v.scallop * v.R * across * Math.pow(down, 4);
  out.set(r * Math.cos(phi) * shape.sx, y, r * Math.sin(phi) * shape.sz);
  return out;
}

function shapeCanopy(v, mesh, t) {
  const pos = mesh.geometry.attributes.position;
  const p = new T.Vector3();
  const segs = mesh.userData.segs;
  for (let i = 0; i <= RINGS; i++) {
    for (let j = 0; j <= segs; j++) {
      canopyPoint(v, mesh, i, j, t, p);
      pos.setXYZ(i * (segs + 1) + j, p.x, p.y, p.z);
    }
  }
  pos.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}

// ---------- One parachute with its load: the canopy, the lines, a man or the crate ----------
function makeDrop(v, what, k) {
  const sys = new T.Group();       // swings about the canopy's middle
  const spinner = new T.Group();   // turns slowly (C)
  sys.add(spinner);
  const canopy = makeCanopy(v);
  spinner.add(canopy);
  const linesAt = -v.R * 0.95;     // where the lines meet, over the man's head
  const lines = new T.LineSegments(new T.BufferGeometry(), new T.LineBasicMaterial({ color: 0x8f8a76, transparent: true, opacity: 0.8 }));
  spinner.add(lines);
  // The load: a man of the table's size, or the crate
  const load = what === 'crate' ? Models.supplyCrate() : Models.soldier('us', 0, false);
  // (the crate on the table has its parachute lying beside it: not while it is still hanging from it)
  if (what === 'crate') load.children[load.children.length - 1].visible = false;
  load.scale.setScalar(what === 'crate' ? 1.8 : MEN);
  const hang = what === 'crate' ? 0.05 * 1.8 : 0.088 * MEN;   // from the load's bottom to where it hangs
  // The risers: from where the lines meet down to his shoulders (or the crate's top)
  const riser = what === 'crate' ? 0.03 : 0.07;
  load.position.y = linesAt - riser - hang;
  load.userData.top = linesAt - riser;
  spinner.add(load);
  load.traverse(c => { if (c.isMesh) { c.material = c.material.clone(); c.material.transparent = true; } });
  scene.add(sys);
  return { v, sys, spinner, canopy, lines, load, linesAt, hang: hang + riser, offset: k * 0.9 };
}

// The lines: from every panel's corner on the hem down to one point, then two risers to the shoulders
function shapeLines(d, t) {
  const { v, canopy, linesAt, load } = d;
  const pts = [];
  const p = new T.Vector3();
  const segs = canopy.userData.segs;
  for (let g = 0; g < v.gores; g++) {
    canopyPoint(v, canopy, RINGS, g * 4, t, p);
    pts.push(p.clone(), new T.Vector3(0, linesAt, 0));
  }
  const shoulder = load.userData.top;
  pts.push(new T.Vector3(0, linesAt, 0), new T.Vector3(0.03, shoulder, 0.03));
  pts.push(new T.Vector3(0, linesAt, 0), new T.Vector3(-0.03, shoulder, -0.03));
  d.lines.geometry.dispose();
  d.lines.geometry = new T.BufferGeometry().setFromPoints(pts);
}

// Where the whole thing is at time t into its loop: falling and swinging, landed, the canopy falling over and going
function placeDrop(d, x, time) {
  const { v, sys, spinner, canopy, lines, load, linesAt, hang } = d;
  const loop = FALL + SETTLE + REST;
  const t = (((time + d.offset) % loop) + loop) % loop;
  const p = Math.min(1, t / FALL);
  // The height of the canopy's middle: from the top down to where the load stands on the table
  const ground = -(linesAt - hang);
  const height = START + (ground - START) * p;
  // The swing: big just after it opens, less near the ground, stopped once down
  const ease = 1 - 0.55 * p;
  const swing = (v.swing * Math.PI / 180) * ease * (t < FALL ? 1 : Math.max(0, 1 - (t - FALL) / 0.3));
  const along = Math.sin(t * Math.PI * 2 / v.period) * swing;
  const across = Math.sin(t * Math.PI * 2 / (v.period * 1.37) + 1.3) * swing * 0.35;
  sys.position.set(x + v.drift * (p - 0.5), height, 0.5);
  sys.rotation.set(across, 0, along);
  spinner.rotation.y = v.spin * t;
  shapeCanopy(v, canopy, t);
  shapeLines(d, t);
  // Landed: the canopy falls over downwind and flattens, then everything fades
  const settle = t < FALL ? 0 : Math.min(1, (t - FALL) / SETTLE);
  const over = Math.min(1, settle * 1.6);
  canopy.rotation.set(0, 0, -over * 1.25);
  canopy.position.set(over * v.R * 1.1, -over * (height - 0.02) * 0.85, 0);
  canopy.scale.set(1, 1 - over * 0.8, 1);
  const fade = settle < 0.6 ? 1 : Math.max(0, 1 - (settle - 0.6) / 0.4);
  canopy.material.opacity = fade;
  lines.visible = over === 0;
  load.traverse(c => { if (c.isMesh) c.material.opacity = fade; });
}

// ---------- The parachute in the game now, copied from drawChutes in board3d.js ----------
const NOW = { from: 0.75, fall: 2.6, gone: 0.6, size: 0.07 };
function makeNow(what) {
  const g = new T.Group();
  scene.add(g);
  return { now: true, g, what, offset: 0 };
}
function placeNow(d, x, time) {
  while (d.g.children.length) d.g.remove(d.g.children[0]);
  const t = time % (FALL + SETTLE + REST);
  if (t > NOW.fall + NOW.gone) return;
  const spots = d.what === 'paras' ? [[-0.15, -0.1], [0.12, -0.05], [0, 0.14]] : [[0, 0]];
  const p = Math.min(1, t / NOW.fall);
  const height = NOW.from * (1 - p);
  const sink = t > NOW.fall ? 1 - (t - NOW.fall) / NOW.gone : 1;
  spots.forEach(([dx, dz], k) => {
    const sway = Math.sin(t * 2.2 + k) * 0.03 * (1 - p);
    const cx = x + dx + sway, cz = 0.5 + dz;
    const canopy = new T.Mesh(new T.SphereGeometry(NOW.size, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: 0xd8d2b8, roughness: 0.9, transparent: true, opacity: sink }));
    canopy.scale.set(1, 0.7 * sink, 1);
    canopy.position.set(cx, height + 0.12, cz);
    d.g.add(canopy);
    const load = new T.Mesh(new T.BoxGeometry(0.02, 0.04, 0.02), new T.MeshStandardMaterial({ color: 0x4f5432, transparent: true, opacity: sink }));
    load.position.set(cx, height + 0.03, cz);
    d.g.add(load);
  });
}

// ---------- Three paratroopers a field (or one crate), each variation in its own column ----------
let drops = [];
const PARA_SPOTS = [[-0.22, -0.15, 0], [0.2, -0.05, 1], [-0.02, 0.2, 2]];
function build(what) {
  drops.forEach(d => scene.remove(d.sys || d.g));
  drops = [];
  VARIANTS.forEach((v, k) => {
    if (v.now) { drops.push({ ...makeNow(what), k }); return; }
    const spots = what === 'paras' ? PARA_SPOTS : [[0, 0, 0]];
    spots.forEach(([dx, dz, late]) => {
      const d = makeDrop(v, what, k);
      // (the three a field land one after another, as men out of one plane)
      d.k = k; d.dx = dx; d.dz = dz; d.offset = -late * 0.7;
      drops.push(d);
    });
  });
}
build('paras');

// ---------- Labels over each column ----------
const tags = VARIANTS.map(v => {
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = `<b>${v.key}</b>${v.name === v.key ? '' : v.name + '<br>'}<small>${v.note}</small>`;
  document.body.appendChild(el);
  return el;
});

// ---------- Fit the camera at the game's slant (about 53° above the table) ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const centre = new T.Vector3(columnX(2), 0.45, 0.5);
  const dir = new T.Vector3(0, Math.sin(0.92), Math.cos(0.92));
  // Back off until all five fields and the tops of the falls show
  for (let dist = 2; dist < 30; dist += 0.1) {
    camera.position.copy(centre).addScaledVector(dir, dist);
    camera.lookAt(centre);
    camera.updateMatrixWorld();
    const fits = [[-0.1, 0, 1.05], [columnX(4) + 0.6, 0, 1.05], [-0.1, START + 0.3, 0.5], [columnX(4) + 0.6, START + 0.3, 0.5]]
      .every(([x, y, z]) => { const q = new T.Vector3(x, y, z).project(camera); return Math.abs(q.x) < 0.96 && Math.abs(q.y) < 0.8; });
    if (fits) break;
  }
}
addEventListener('resize', resize);
resize();

// ---------- Buttons ----------
let slow = false;
document.querySelectorAll('[data-what]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-what]').forEach(o => o.classList.toggle('on', o === b));
  build(b.dataset.what);
});
document.getElementById('slow').onclick = e => { slow = !slow; e.target.classList.toggle('on', slow); };

// ---------- Every frame ----------
let clock = 0, last = performance.now();
function frame(now) {
  clock += ((now - last) / 1000) * (slow ? 0.35 : 1);
  last = now;
  drops.forEach(d => {
    const x = columnX(d.k) + (d.dx || 0);
    if (d.now) placeNow(d, x, clock);
    else { placeDrop(d, x, clock); d.sys.position.z = 0.5 + d.dz; }
  });
  // The labels sit under the near edge of each field
  VARIANTS.forEach((v, k) => {
    const q = new T.Vector3(columnX(k), 0, 1.08).project(camera);
    tags[k].style.left = ((q.x + 1) / 2 * innerWidth) + 'px';
    tags[k].style.top = ((1 - q.y) / 2 * innerHeight) + 'px';
  });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
